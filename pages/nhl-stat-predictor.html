<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{ page.title }}</title>
      <link rel="stylesheet" href="../styles/styles.css">
      <script type="module" src="../scripts/pages/lookupBootstrap.js"></script>
   </head>
   <body>
      <main>
         <p class="eyebrow">{{ page.eyebrow }}</p>
         <h1>{{ page.heading }}</h1>
         <p class="lede">{{ page.lede }}</p>

         <form id="lookup-form">
            <label for="player-name">{{ page.playerNameLabel }}</label>
            <div class="lookup-row">
               <div class="player-name-field">
                  <input
                     id="player-name"
                     name="player-name"
                     type="search"
                     placeholder="{{ page.placeholder }}"
                     autocomplete="off"
                     spellcheck="false"
                  >
                  <div
                     id="player-name-results"
                     class="player-name-autocomplete"
                     data-empty="{{ page.noMatches }}"
                  ></div>
               </div>
               <button type="submit">{{ page.submit }}</button>
            </div>
            <p id="lookup-error" class="lookup-error" hidden role="alert">{{ page.playerRequired }}</p>
         </form>

         <section id="projection" hidden>
            <h2><button class="player-history-trigger" type="button" data-player-name aria-haspopup="dialog" aria-controls="player-history"></button></h2>
            <p class="player-meta" data-player-meta></p>
            <div class="season-stats" data-season-stats-container hidden>
               <div class="season-tabs" role="tablist" aria-label="Season statistics">
                  <button id="current-statline-tab" class="season-tab" type="button" role="tab" aria-selected="true" aria-controls="season-statline" data-season-tab="current">{{ page.currentStatlineLabel }}</button>
                  <button id="full-season-pace-tab" class="season-tab" type="button" role="tab" aria-selected="false" aria-controls="season-statline" tabindex="-1" data-season-tab="pace">{{ page.fullSeasonPaceLabel }}</button>
               </div>
               <div id="season-statline" class="statline" data-season-stats tabindex="0" role="tabpanel" aria-labelledby="current-statline-tab">
                  <div>
                     <span class="label">GP</span>
                     <span class="value context" data-games-played></span>
                  </div>
                  <div>
                     <span class="label">G</span>
                     <span class="value" data-goals></span>
                  </div>
                  <div>
                     <span class="label">A</span>
                     <span class="value" data-assists></span>
                  </div>
                  <div>
                     <span class="label">P</span>
                     <span class="value" data-points></span>
                  </div>
                  <div>
                     <span class="label">PIM</span>
                     <span class="value" data-penalty-minutes></span>
                  </div>
                  <div>
                     <span class="label" title="Even-strength goals">ESG</span>
                     <span class="value" data-even-strength-goals></span>
                  </div>
                  <div>
                     <span class="label" title="Even-strength points">ESP</span>
                     <span class="value" data-even-strength-points></span>
                  </div>
                  <div>
                     <span class="label">PPG</span>
                     <span class="value" data-power-play-goals></span>
                  </div>
                  <div>
                     <span class="label">PPP</span>
                     <span class="value" data-power-play-points></span>
                  </div>
                  <div>
                     <span class="label">SHG</span>
                     <span class="value" data-short-handed-goals></span>
                  </div>
                  <div>
                     <span class="label">SHP</span>
                     <span class="value" data-short-handed-points></span>
                  </div>
                  <div>
                     <span class="label">TOI/G</span>
                     <span class="value context" data-toi></span>
                  </div>
                  <div>
                     <span class="label" title="Shots on goal">SOG</span>
                     <span class="value" data-shots></span>
                  </div>
                  <div>
                     <span class="label" title="Shooting percentage">S%</span>
                     <span class="value" data-shooting-percentage></span>
                  </div>
               </div>
            </div>
            <p class="season">{{ page.seasonLabel }}</p>
            <div class="statline" data-projection-stats tabindex="0" role="group" aria-label="Projected statistics">
               <div>
                  <span class="label">GP</span>
                  <span class="value context" data-games-played></span>
               </div>
               <div>
                  <span class="label">G</span>
                  <span class="value" data-goals></span>
               </div>
               <div>
                  <span class="label">A</span>
                  <span class="value" data-assists></span>
               </div>
               <div>
                  <span class="label">P</span>
                  <span class="value" data-points></span>
               </div>
               <div>
                  <span class="label">PIM</span>
                  <span class="value" data-penalty-minutes></span>
               </div>
               <div>
                  <span class="label" title="Even-strength goals">ESG</span>
                  <span class="value" data-even-strength-goals></span>
               </div>
               <div>
                  <span class="label" title="Even-strength points">ESP</span>
                  <span class="value" data-even-strength-points></span>
               </div>
               <div>
                  <span class="label">PPG</span>
                  <span class="value" data-power-play-goals></span>
               </div>
               <div>
                  <span class="label">PPP</span>
                  <span class="value" data-power-play-points></span>
               </div>
               <div>
                  <span class="label">SHG</span>
                  <span class="value" data-short-handed-goals></span>
               </div>
               <div>
                  <span class="label">SHP</span>
                  <span class="value" data-short-handed-points></span>
               </div>
               <div>
                  <span class="label">TOI/G</span>
                  <span class="value context" data-toi></span>
               </div>
               <div>
                  <span class="label" title="Shots on goal">SOG</span>
                  <span class="value" data-shots></span>
               </div>
               <div>
                  <span class="label" title="Shooting percentage">S%</span>
                  <span class="value" data-shooting-percentage></span>
               </div>
            </div>
         </section>
      </main>
      <dialog id="player-history" aria-labelledby="history-player-name">
         <header class="history-header">
            <div>
               <h2 id="history-player-name"></h2>
               <p>{{ page.historyLabel }}</p>
            </div>
            <form method="dialog"><button class="history-close" title="{{ page.closeHistoryLabel }}" aria-label="{{ page.closeHistoryLabel }}" autofocus>&times;</button></form>
         </header>
         <div class="history-table-container" tabindex="0">
            <table class="history-table">
               <thead><tr>
                  <th scope="col">Season</th><th scope="col">League</th><th scope="col">Team</th>
                  <th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="gamesPlayed" aria-label="Sort by games played">GP</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="goals" aria-label="Sort by goals">G</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="assists" aria-label="Sort by assists">A</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="points" aria-label="Sort by points">P</button></th>
                  <th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="penaltyMinutes" aria-label="Sort by penalty minutes">PIM</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="evenStrengthGoals" aria-label="Sort by even-strength goals">ESG</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="evenStrengthPoints" aria-label="Sort by even-strength points">ESP</button></th>
                  <th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="powerPlayGoals" aria-label="Sort by power-play goals">PPG</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="powerPlayPoints" aria-label="Sort by power-play points">PPP</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="shortHandedGoals" aria-label="Sort by short-handed goals">SHG</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="shortHandedPoints" aria-label="Sort by short-handed points">SHP</button></th>
                  <th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="timeOnIcePerGame" aria-label="Sort by time on ice per game">TOI/G</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="shots" aria-label="Sort by shots on goal">SOG</button></th><th scope="col" aria-sort="none"><button type="button" class="history-sort" data-history-sort="shootingPercentage" aria-label="Sort by shooting percentage">S%</button></th>
               </tr></thead>
               <tbody data-history-seasons></tbody>
               <tfoot><tr data-history-career><th scope="row" colspan="3">{{ page.careerLabel }}</th></tr></tfoot>
            </table>
         </div>
      </dialog>
   </body>
</html>
