name: Ingest

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest skater seasons
        run: python3 -m api ingest

      - name: Upload ingested data
        uses: actions/upload-artifact@v4
        with:
          name: skaters
          path: |
            data/processed/skaters.sqlite
            data/raw
          if-no-files-found: error
          retention-days: 14
