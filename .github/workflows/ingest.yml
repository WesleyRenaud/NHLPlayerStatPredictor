name: Ingest

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ingest.yml
      - api/ingest/ingest_artifact_puller.py
      - api/recency/production_model_provider.py
      - api/recency/production_model_recorder.py

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest skater seasons
        run: python3 -m api ingest

      - name: Upload ingested data
        uses: actions/upload-artifact@v4
        with:
          name: skaters
          path: |
            data/processed/skaters.sqlite
            data/processed/scoring_weights.json
            data/processed/scoring_multipliers.json
            data/processed/pim_weights.json
            data/processed/pim_multipliers.json
            data/processed/shots_weights.json
            data/processed/shots_multipliers.json
            data/processed/scoring_component_shares.json
            data/processed/production_trajectory.json
            data/processed/prospect_calibration.json
            data/processed/availability_weights.json
            data/processed/league_factors.json
            data/processed/league_arrivals.json
            data/processed/team_factors.json
            data/processed/depth_charts.json
            data/processed/slot_averages.json
            data/processed/ice_chosen_shares.json
            data/processed/skater_ice.json
            data/raw
          if-no-files-found: error
          retention-days: 14
